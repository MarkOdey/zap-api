services:
  mongo:
    image: mongo:7
    ports:                                                                                                                                                                                    
      - "27018:27017" 
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    # Come back after an out-of-memory kill rather than staying down.
    restart: unless-stopped
    # Bound the process so a runaway model load fails one container instead of
    # taking the whole Docker VM with it. Inference peaks around 4.5GB.
    mem_limit: 5g
    ports:
      - "3000:3000"
    environment:
      - MONGO_URL=mongodb://mongo:27017/zap
    depends_on:
      - mongo
    volumes:
      - ./data:/app/data
      - models:/app/.models

volumes:
  mongo_data:
  models:
